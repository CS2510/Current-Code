<!doctype html> <!-- Tells the browser we are using html 5-->
<html> <!-- Start the html document-->

<head> <!-- Provide the header (meta) Information-->
    <title>Game Loop</title> <!-- The title of the html page, as shown in the tab by the browser-->

    <!-- Cascading Style Sheets that define how to render elements in our page-->
    <style>
        /* Remove the margins and make sure we never show the scrollbars */
        * {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body> <!-- The main content in our browser window-->
    <canvas id="canv"> <!-- The canvas where we will draw our game -->

    </canvas>

    <!-- Include external js files, similar to Python import statements-->
    <script src="../engine/Vector2.js"></script>
    <script src="../engine/Input.js"></script>
    <script src="../engine/Engine.js"></script>

    <!-- Our custom code for our game. In the future, all this code will be in individual js files-->
    <script>



        //Put the position of our game object in a variable, 
        //so we can update it over time
        let position = new Vector2(50, 50)


        /**
         * Update our game.
         * Later, this code will be in our engine.
         */
        function update() {
            // console.log(Input.keysDown)
            //Move the game object across the screen slowly


            if (Input.keysDown.includes("ArrowRight"))
                position.x = position.x + 1
            if (Input.keysDown.includes("ArrowLeft"))
                position.x = position.x - 1
            if (Input.keysDown.includes("ArrowUp"))
                position.y = position.y - 1
            if (Input.keysDown.includes("ArrowDown"))
                position.y = position.y + 1
        }

        /**
         * Draw our game.
         * Later, this code will be in our engine.
         */
        function draw(ctx) {


            //Signaling to the context that I'm going to draw something
            ctx.save()

            //Set center of our object
            ctx.translate(position.x, position.y)

            //Move to the corners of the polygon representing our game object
            ctx.lineTo(0, -20)
            ctx.lineTo(10, -30)
            ctx.lineTo(10, 0)
            ctx.lineTo(50, -40)
            ctx.lineTo(60, -50)
            ctx.lineTo(500, 0)
            ctx.lineTo(0, 40)

            //Set the color of the fill
            ctx.fillStyle = "black"
            //Tell the canvas to draw the object
            ctx.fill()

            //Signaling that I'm done drawing
            ctx.restore()
        }

        Engine.start()



    </script>
</body>

</html>
