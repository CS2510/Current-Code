<html>

<head>
    <title>Game Loop</title>
    <style>
        *{
            margin:0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <canvas id="canv">

    </canvas>
    <script src="Vector2.js"></script>
    <script>
        let canvas = document.querySelector("#canv")
        let ctx = canvas.getContext("2d")



        let position = new Vector2(50, 50)

        function gameLoop() {
            update()
            draw()
            requestAnimationFrame(gameLoop)
        }

        function update() {
            position.x = position.x + .1
        }

        function draw() {

            //Expand the size of the canvas
            canvas.width = window.innerWidth
            canvas.height = window.innerHeight

            //Signaling to the context that I'm going to draw something
            ctx.save()

            //Set center of our object
            ctx.translate(position.x, position.y)

            ctx.lineTo(0, -20)
            ctx.lineTo(10, -30)
            ctx.lineTo(10, 0)
            ctx.lineTo(50, -40)
            ctx.lineTo(60, -50)
            ctx.lineTo(500, 0)
            ctx.lineTo(0, 40)

            ctx.fillStyle = "black"
            ctx.fill()

            //Signaling that I'm done drawing
            ctx.restore()
        }

        requestAnimationFrame(gameLoop)

    </script>
</body>

</html>
